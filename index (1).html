<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FIDELU Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green-primary: #2D6A4F;
      --green-secondary: #40916C;
      --bg-dark: #111827;
      --bg-card: #1F2937;
      --bg-card-dark: #0D1117;
      --accent: #E06B00;
      --text-main: #FFFFFF;
      --text-muted: #6B7280;
      --text-secondary: #9CA3AF;
      --border: rgba(255,255,255,0.06);
      --green-border: rgba(45,106,79,0.35);
      --green-tint: rgba(45,106,79,0.15);
    }
    body { background: var(--bg-dark); color: var(--text-main); font-family: 'Syne', sans-serif; min-height: 100vh; }

    /* HEADER */
    .header {
      background: var(--bg-card-dark); border-bottom: 1px solid var(--green-border);
      padding: 14px 32px; display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 10;
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-mark {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--green-primary), var(--green-secondary));
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 800;
    }
    .logo-text { font-size: 19px; font-weight: 800; letter-spacing: 2.5px; }
    .brand-pill {
      font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: #6EE7B7;
      background: var(--green-tint); border: 1px solid var(--green-border);
      padding: 5px 14px; border-radius: 20px;
    }
    .updated {
      font-size: 11px; color: var(--text-muted); font-family: 'DM Mono', monospace;
      display: flex; align-items: center; gap: 6px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #34D399; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.25} }

    /* TABS */
    .tabs {
      background: var(--bg-card-dark); border-bottom: 1px solid var(--border);
      padding: 0 32px; display: flex; gap: 4px;
    }
    .tab {
      font-size: 12px; font-weight: 700; letter-spacing: 1px; color: var(--text-muted);
      padding: 12px 18px; cursor: pointer; border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s; text-transform: uppercase; user-select: none;
    }
    .tab:hover { color: var(--text-secondary); }
    .tab.active { color: #6EE7B7; border-bottom-color: var(--green-secondary); }

    /* BODY */
    .body { padding: 28px 32px 32px; max-width: 1200px; }
    .section-label {
      font-size: 10px; font-weight: 700; letter-spacing: 3px; color: #4B5563;
      text-transform: uppercase; margin: 0 0 12px;
    }
    .section-label:not(:first-child) { margin-top: 28px; }

    /* GRIDS */
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    @media (max-width: 900px) {
      .grid-3 { grid-template-columns: repeat(2, 1fr); }
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      .grid-3, .grid-4 { grid-template-columns: 1fr; }
      .body { padding: 20px 16px; }
      .header, .tabs { padding-left: 16px; padding-right: 16px; }
    }

    /* CARDS */
    .card {
      background: var(--bg-card); border-radius: 14px; padding: 20px 22px;
      border: 1px solid var(--border); position: relative; overflow: hidden;
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--green-primary), var(--green-secondary));
    }
    .card.hero { background: linear-gradient(135deg, #1a2e23 0%, var(--bg-card) 65%); border-color: var(--green-border); }
    .card.hero::before { background: linear-gradient(90deg, var(--accent), #F59E0B); }
    .card-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; }
    .card-value { font-size: 30px; font-weight: 800; line-height: 1; color: var(--text-main); }
    .card-value.accent   { color: var(--accent); }
    .card-value.green    { color: #34D399; }
    .card-value.muted    { color: var(--text-secondary); }
    .card-value.lift-pos { color: #34D399; }
    .card-value.lift-neg { color: #F87171; }
    .card-value.sm { font-size: 24px; }
    .card-value.xs { font-size: 20px; }
    .card-sub { font-size: 11px; color: var(--text-muted); margin-top: 7px; }

    /* INSIGHTS */
    .insights-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; gap: 16px; }
    .insights-title { font-size: 13px; color: var(--text-muted); line-height: 1.6; }
    .btn-generate {
      background: linear-gradient(135deg, var(--green-primary), var(--green-secondary));
      color: #fff; border: none; border-radius: 10px; padding: 12px 22px;
      font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700;
      cursor: pointer; white-space: nowrap; transition: opacity 0.2s; flex-shrink: 0;
    }
    .btn-generate:hover { opacity: 0.85; }
    .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }
    .insight-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
      padding: 22px 24px 22px 28px; margin-bottom: 14px; position: relative; overflow: hidden;
    }
    .insight-card::before {
      content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 3px;
      background: linear-gradient(180deg, var(--green-primary), var(--green-secondary));
    }
    .insight-metric { font-size: 10px; font-weight: 700; letter-spacing: 2px; color: var(--green-secondary); text-transform: uppercase; margin-bottom: 5px; }
    .insight-value  { font-size: 22px; font-weight: 800; color: var(--text-main); margin-bottom: 10px; }
    .insight-text   { font-size: 14px; color: var(--text-secondary); line-height: 1.7; }
    .insights-empty { text-align: center; padding: 70px 20px; color: var(--text-muted); }
    .insights-empty-icon { font-size: 32px; margin-bottom: 14px; }
    .insights-empty-text { font-size: 14px; line-height: 1.7; }

    /* LOADING / ERROR */
    .loading-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 16px; }
    .spinner { width: 36px; height: 36px; border: 3px solid var(--green-border); border-top-color: var(--green-secondary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    .spinner.sm { width: 15px; height: 15px; border-width: 2px; display: inline-block; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 14px; color: var(--text-muted); }
    .error-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 12px; text-align: center; padding: 40px; }
    .error-icon  { font-size: 40px; color: #F87171; }
    .error-title { font-size: 18px; font-weight: 700; }
    .error-msg   { font-size: 13px; color: var(--text-muted); max-width: 420px; line-height: 1.6; }

    /* FOOTER */
    .footer { padding: 16px 32px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
    .footer-brand { font-size: 12px; font-weight: 800; letter-spacing: 2px; color: var(--green-primary); }
    .footer-text  { font-size: 11px; color: #374151; }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-mark">F</div>
    <span class="logo-text">FIDELU</span>
  </div>
  <div class="brand-pill" id="brandName">Cargando...</div>
  <div class="updated">
    <div class="dot"></div>
    <span id="updatedAt">Actualizando...</span>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('metricas', this)">Métricas</div>
  <div class="tab" onclick="switchTab('insights', this)">Insights IA</div>
</div>

<div id="appContent">
  <div class="loading-screen">
    <div class="spinner"></div>
    <p class="loading-text">Cargando datos del dashboard...</p>
  </div>
</div>

<div class="footer">
  <div class="footer-brand">FIDELU</div>
  <div class="footer-text">Datos actualizados en tiempo real desde Google Sheets</div>
</div>

<script>
  // ═══════════════════════════════════════════════════════
  //  CLAVES API
  // ═══════════════════════════════════════════════════════
  const SHEETS_KEY = 'AIzaSyAdM_yBdfmMQhznZpRP6FFPmbJhx-6uvTc';
  const GEMINI_KEY = 'AIzaSyC1uyAE68k0WVUqCfdOnkQTsNx1plVUTIg';

  // ═══════════════════════════════════════════════════════
  //  PARÁMETROS DE URL
  //  Uso: ?sheet=ID_DE_LA_HOJA&brand=NombreCliente
  // ═══════════════════════════════════════════════════════
  const params  = new URLSearchParams(window.location.search);
  const sheetId = params.get('sheet');
  const brand   = params.get('brand') || 'Cliente';
  document.getElementById('brandName').textContent = brand.toUpperCase();

  // ═══════════════════════════════════════════════════════
  //  ESTADO GLOBAL
  // ═══════════════════════════════════════════════════════
  let currentMetrics = null;
  let currentRawRows = [];
  let currentTab     = 'metricas';

  // ═══════════════════════════════════════════════════════
  //  TABS
  // ═══════════════════════════════════════════════════════
  function switchTab(tab, el) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    if (!currentMetrics) return;
    tab === 'metricas' ? renderMetricas(currentMetrics) : renderInsightsPanel();
  }

  // ═══════════════════════════════════════════════════════
  //  FORMATTERS
  // ═══════════════════════════════════════════════════════
  const fmt = {
    currency:      v => { const n = parseInt(v);   return (isNaN(n)||n===0) ? '—' : '$'+n.toLocaleString('es-CO'); },
    number:        v => { const n = parseInt(v);   return isNaN(n) ? '—' : n.toLocaleString('es-CO'); },
    percent:       v => { const n = parseFloat(v); if(isNaN(n)) return '—'; return (n>=0?'+':'')+(n*100).toFixed(1)+'%'; },
    percentNoSign: v => { const n = parseFloat(v); return isNaN(n) ? '—' : (n*100).toFixed(1)+'%'; },
    roi:           v => { const n = parseFloat(v); return (isNaN(n)||n===0) ? '—' : n.toFixed(1)+'x'; }
  };

  // ═══════════════════════════════════════════════════════
  //  FETCH GOOGLE SHEETS
  //  Lee la pestaña "dashboard", columnas A-D
  // ═══════════════════════════════════════════════════════
  async function fetchMetrics() {
    if (!sheetId) throw new Error('NO_SHEET_ID');
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/dashboard!A:D?key=${SHEETS_KEY}`;
    const res = await fetch(url);
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err?.error?.message || `HTTP ${res.status}`);
    }
    const data = await res.json();
    const rows = (data.values || []).slice(1); // saltar encabezado
    currentRawRows = rows;
    const metrics = {};
    rows.forEach(row => { if (row[2]) metrics[row[2].trim()] = row[1] ?? ''; });
    return metrics;
  }

  // ═══════════════════════════════════════════════════════
  //  CARD BUILDER
  // ═══════════════════════════════════════════════════════
  function card({ label, value, sub='', size='', extra='', hero=false }) {
    return `<div class="card${hero?' hero':''}">
      <div class="card-label">${label}</div>
      <div class="card-value ${size} ${extra}">${value}</div>
      ${sub ? `<div class="card-sub">${sub}</div>` : ''}
    </div>`;
  }
  const liftClass = v => parseFloat(v) >= 0 ? 'lift-pos' : 'lift-neg';

  // ═══════════════════════════════════════════════════════
  //  RENDER MÉTRICAS
  // ═══════════════════════════════════════════════════════
  function renderMetricas(m) {
    const hhmm = new Date().toLocaleTimeString('es-CO', { hour:'2-digit', minute:'2-digit' });
    document.getElementById('updatedAt').textContent = `Actualizado a las ${hhmm}`;

    document.getElementById('appContent').innerHTML = `<div class="body">

      <div class="section-label">KPIs principales</div>
      <div class="grid-3">
        ${card({ label:'💰 Revenue recuperado', value:fmt.currency(m.total_revenue),         sub:'Ingresos atribuidos a email', hero:true, extra:'accent' })}
        ${card({ label:'🛍 Pedidos atribuidos',  value:fmt.number(m.attributed_orders),        sub:'Conversiones directas' })}
        ${card({ label:'📈 Factor ROI',          value:fmt.roi(m.roi_factor),                  sub:'Retorno sobre inversión', extra:'green' })}
      </div>

      <div class="section-label">Métricas de valor</div>
      <div class="grid-3">
        ${card({ label:'AOV FIDELU',  value:fmt.currency(m.aov_fidelu),       sub:'Ticket promedio recuperado', size:'sm' })}
        ${card({ label:'AOV Tienda',  value:fmt.currency(m.store_avg_aov),    sub:'Ticket promedio general',    size:'sm', extra:'muted' })}
        ${card({ label:'Lift AOV',    value:fmt.percent(m.aov_lift_percent),  sub:'Mejora sobre baseline',      size:'sm', extra:liftClass(m.aov_lift_percent) })}
      </div>

      <div class="section-label">Eficiencia de conversión</div>
      <div class="grid-3">
        ${card({ label:'Total clicks',       value:fmt.number(m.total_clicks),               size:'sm' })}
        ${card({ label:'Click → conversión', value:fmt.percentNoSign(m.click_to_conversion), size:'sm' })}
        ${card({ label:'Earning / click',    value:fmt.currency(m.earning_per_click),        size:'sm' })}
      </div>

      <div class="section-label">Salud del sistema</div>
      <div class="grid-4">
        ${card({ label:'Emails enviados',      value:fmt.number(m.total_emails),          size:'xs' })}
        ${card({ label:'Clientes contactados', value:fmt.number(m.clientes_contactados),  size:'xs' })}
        ${card({ label:'Unsubs gestionados',   value:fmt.number(m.unsubscribes_managed),  size:'xs', extra:'muted' })}
        ${card({ label:'Bounces gestionados',  value:fmt.number(m.bounces_managed),       size:'xs', extra:'muted' })}
      </div>

    </div>`;
  }

  // ═══════════════════════════════════════════════════════
  //  RENDER PANEL INSIGHTS
  // ═══════════════════════════════════════════════════════
  function renderInsightsPanel() {
    const hhmm = new Date().toLocaleTimeString('es-CO', { hour:'2-digit', minute:'2-digit' });
    document.getElementById('updatedAt').textContent = `Actualizado a las ${hhmm}`;

    document.getElementById('appContent').innerHTML = `<div class="body">
      <div class="insights-header">
        <p class="insights-title">
          Análisis generado por IA con los datos actuales de <strong>${brand}</strong>.<br>
          Cada métrica recibe un comentario adaptado a los números reales.
        </p>
        <button class="btn-generate" id="btnGenerate" onclick="generarInsights()">
          ✦ Generar insights
        </button>
      </div>
      <div id="insightsContainer">
        <div class="insights-empty">
          <div class="insights-empty-icon">✦</div>
          <div class="insights-empty-text">
            Hacé clic en "Generar insights" para que la IA analice<br>
            los datos actuales y genere un comentario por cada métrica.
          </div>
        </div>
      </div>
    </div>`;
  }

  // ═══════════════════════════════════════════════════════
  //  GENERAR INSIGHTS CON GEMINI
  // ═══════════════════════════════════════════════════════
  async function generarInsights() {
    const btn = document.getElementById('btnGenerate');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner sm"></span>Analizando...';

    // Solo filas con datos reales (excluir ceros, vacíos y errores de fórmula)
    const filas = currentRawRows.filter(r =>
      r[2] && r[1] && r[1] !== '0' && r[1] !== '' && r[1] !== '#DIV/0!' && r[1] !== '$0.00' && r[1] !== '0.00%'
    );

    const datosTexto = filas.map(r =>
      `- ${r[0]}: ${r[1]}${r[3] ? ' (contexto: ' + r[3] + ')' : ''}`
    ).join('\n');

    const prompt = `Sos el analista de FIDELU, una agencia de retención por email para ecommerce latinoamericano. Tu cliente se llama ${brand}.

Datos actuales del dashboard:
${datosTexto}

Para cada métrica escribí un insight de 2-3 oraciones que:
1. Explique qué significa ese número para el negocio del cliente
2. Lo contextualice (¿es bueno, normal, bajo?)
3. Sugiera una acción concreta si aplica

Usá lenguaje directo y amigable, sin tecnicismos. Hablale directamente al dueño del negocio.

Respondé ÚNICAMENTE con este JSON, sin texto extra, sin backticks, sin explicaciones:
[{"indicador":"Nombre legible","valor":"valor formateado","insight":"texto del insight"}]`;

    try {
      const res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { temperature: 0.7, maxOutputTokens: 2048 }
          })
        }
      );

      const data = await res.json();
      const texto = data.candidates?.[0]?.content?.parts?.[0]?.text || '[]';
      const clean = texto.replace(/```json|```/g, '').trim();
      const insights = JSON.parse(clean);

      const container = document.getElementById('insightsContainer');

      if (!insights.length) {
        container.innerHTML = `
          <div class="insights-empty">
            <div class="insights-empty-icon">📊</div>
            <div class="insights-empty-text">No hay datos suficientes para generar insights todavía.<br>Cargá datos reales en la hoja y volvé a intentarlo.</div>
          </div>`;
      } else {
        container.innerHTML = insights.map(i => `
          <div class="insight-card">
            <div class="insight-metric">${i.indicador}</div>
            <div class="insight-value">${i.valor}</div>
            <div class="insight-text">${i.insight}</div>
          </div>`).join('');
      }

    } catch(e) {
      console.error(e);
      document.getElementById('insightsContainer').innerHTML = `
        <div class="error-screen">
          <div class="error-icon">⚠</div>
          <div class="error-title">No se pudieron generar los insights</div>
          <div class="error-msg">Revisá la consola del navegador (F12) para ver el error exacto.</div>
        </div>`;
    }

    btn.disabled = false;
    btn.innerHTML = '✦ Regenerar';
  }

  // ═══════════════════════════════════════════════════════
  //  ERROR
  // ═══════════════════════════════════════════════════════
  function renderError(code) {
    const msgs = {
      NO_SHEET_ID: ['Falta el ID de la hoja', 'Agregá <code>?sheet=ID_DE_LA_HOJA</code> al final de la URL.'],
      default:     ['No se pudieron cargar los datos', 'Verificá que la hoja esté compartida como "Cualquier persona con el enlace puede ver" y que el ID sea correcto.']
    };
    const [title, msg] = msgs[code] || msgs.default;
    document.getElementById('appContent').innerHTML = `
      <div class="error-screen">
        <div class="error-icon">⚠</div>
        <div class="error-title">${title}</div>
        <div class="error-msg">${msg}</div>
      </div>`;
  }

  // ═══════════════════════════════════════════════════════
  //  INIT
  // ═══════════════════════════════════════════════════════
  async function loadData() {
    try {
      const metrics = await fetchMetrics();
      currentMetrics = metrics;
      currentTab === 'metricas' ? renderMetricas(metrics) : renderInsightsPanel();
    } catch(e) {
      console.error(e);
      renderError(e.message === 'NO_SHEET_ID' ? 'NO_SHEET_ID' : 'default');
    }
  }

  loadData();
  setInterval(loadData, 5 * 60 * 1000); // auto-refresh cada 5 minutos
</script>
</body>
</html>
