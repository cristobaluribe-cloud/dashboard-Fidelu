<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FIDELU Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-primary: #2D6A4F;
      --green-secondary: #40916C;
      --bg-dark: #111827;
      --bg-card: #1F2937;
      --bg-card-dark: #0D1117;
      --accent: #E06B00;
      --text-main: #FFFFFF;
      --text-muted: #6B7280;
      --text-secondary: #9CA3AF;
      --border: rgba(255,255,255,0.06);
      --green-border: rgba(45,106,79,0.35);
      --green-tint: rgba(45,106,79,0.15);
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    .header {
      background: var(--bg-card-dark);
      border-bottom: 1px solid var(--green-border);
      padding: 14px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-mark {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--green-primary), var(--green-secondary));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 800; letter-spacing: -0.5px;
    }
    .logo-text { font-size: 19px; font-weight: 800; letter-spacing: 2.5px; }
    .brand-pill {
      font-size: 12px; font-weight: 700; letter-spacing: 1.5px;
      color: #6EE7B7;
      background: var(--green-tint);
      border: 1px solid var(--green-border);
      padding: 5px 14px; border-radius: 20px;
    }
    .updated {
      font-size: 11px; color: var(--text-muted);
      font-family: 'DM Mono', monospace;
      display: flex; align-items: center; gap: 6px;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #34D399;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.25} }

    /* ── BODY ── */
    .body { padding: 28px 32px 32px; max-width: 1200px; }

    .section-label {
      font-size: 10px; font-weight: 700; letter-spacing: 3px;
      color: #4B5563; text-transform: uppercase;
      margin: 0 0 12px;
    }
    .section-label:not(:first-child) { margin-top: 28px; }

    /* ── GRIDS ── */
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

    @media (max-width: 900px) {
      .grid-3 { grid-template-columns: repeat(2, 1fr); }
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      .grid-3, .grid-4 { grid-template-columns: 1fr; }
      .body { padding: 20px 16px; }
      .header { padding: 12px 16px; }
    }

    /* ── CARDS ── */
    .card {
      background: var(--bg-card);
      border-radius: 14px;
      padding: 20px 22px;
      border: 1px solid var(--border);
      position: relative; overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--green-primary), var(--green-secondary));
    }
    .card.hero {
      background: linear-gradient(135deg, #1a2e23 0%, var(--bg-card) 65%);
      border-color: var(--green-border);
    }
    .card.hero::before {
      background: linear-gradient(90deg, var(--accent), #F59E0B);
    }

    .card-label {
      font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
      color: var(--text-muted); text-transform: uppercase;
      margin-bottom: 10px;
    }
    .card-value {
      font-size: 30px; font-weight: 800; line-height: 1;
      color: var(--text-main);
      font-family: 'Syne', sans-serif;
    }
    .card-value.accent { color: var(--accent); }
    .card-value.green  { color: #34D399; }
    .card-value.muted  { color: var(--text-secondary); }
    .card-value.lift-pos { color: #34D399; }
    .card-value.lift-neg { color: #F87171; }
    .card-value.sm { font-size: 24px; }
    .card-value.xs { font-size: 20px; }
    .card-sub {
      font-size: 11px; color: var(--text-muted);
      margin-top: 7px;
    }

    /* ── LOADING ── */
    .loading-screen {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 60vh; gap: 16px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--green-border);
      border-top-color: var(--green-secondary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 14px; color: var(--text-muted); }

    /* ── ERROR ── */
    .error-screen {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 60vh; gap: 12px; text-align: center;
      padding: 40px;
    }
    .error-icon { font-size: 40px; color: #F87171; }
    .error-title { font-size: 18px; font-weight: 700; color: var(--text-main); }
    .error-msg { font-size: 13px; color: var(--text-muted); max-width: 400px; line-height: 1.6; }

    /* ── SKELETON ── */
    .skeleton {
      background: linear-gradient(90deg, #1F2937 25%, #263548 50%, #1F2937 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 6px;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* ── FOOTER ── */
    .footer {
      padding: 16px 32px;
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 12px;
    }
    .footer-brand { font-size: 12px; font-weight: 800; letter-spacing: 2px; color: var(--green-primary); }
    .footer-text  { font-size: 11px; color: #374151; }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-mark">F</div>
    <span class="logo-text">FIDELU</span>
  </div>
  <div class="brand-pill" id="brandName">Cargando...</div>
  <div class="updated">
    <div class="dot"></div>
    <span id="updatedAt">Actualizando...</span>
  </div>
</div>

<div id="appContent">
  <div class="loading-screen">
    <div class="spinner"></div>
    <p class="loading-text">Cargando datos del dashboard...</p>
  </div>
</div>

<div class="footer">
  <div class="footer-brand">FIDELU</div>
  <div class="footer-text">Datos actualizados en tiempo real desde Google Sheets</div>
</div>

<script>
  // ── CONFIG ──────────────────────────────────────────────────────────────────
  // La API Key se inyecta en Vercel como NEXT_PUBLIC_GOOGLE_API_KEY o en
  // un archivo .env.local para desarrollo local.
  // Para un sitio estático en Vercel, usamos window.GOOGLE_API_KEY que se puede
  // setear con una ruta API de Next.js, OR simplemente hardcodear SOLO en dev
  // y usar vercel.json rewrites para producción.
  //
  // OPCIÓN SIMPLE (recomendada para empezar): reemplazá el valor de abajo
  // solo en tu entorno local. En Vercel, la variable se inyecta distinto.
  // Ver sección de deploy más abajo.
  // ────────────────────────────────────────────────────────────────────────────
  const API_KEY = window.__GOOGLE_API_KEY__ || ''; // se setea via vercel.json o env

  // ── URL PARAMS ──────────────────────────────────────────────────────────────
  const params   = new URLSearchParams(window.location.search);
  const sheetId  = params.get('sheet');
  const brand    = params.get('brand') || 'Cliente';

  document.getElementById('brandName').textContent = brand.toUpperCase();

  // ── FORMATTERS ──────────────────────────────────────────────────────────────
  const fmt = {
    currency: v => {
      const n = parseInt(v);
      if (isNaN(n) || n === 0) return '—';
      return '$' + n.toLocaleString('es-CO');
    },
    number: v => {
      const n = parseInt(v);
      if (isNaN(n)) return '—';
      return n.toLocaleString('es-CO');
    },
    percent: v => {
      const n = parseFloat(v);
      if (isNaN(n)) return '—';
      const pct = (n * 100).toFixed(1);
      return (n >= 0 ? '+' : '') + pct + '%';
    },
    percentNoSign: v => {
      const n = parseFloat(v);
      if (isNaN(n)) return '—';
      return (n * 100).toFixed(1) + '%';
    },
    roi: v => {
      const n = parseFloat(v);
      if (isNaN(n) || n === 0) return '—';
      return n.toFixed(1) + 'x';
    }
  };

  // ── FETCH ───────────────────────────────────────────────────────────────────
  async function fetchMetrics() {
    if (!sheetId) throw new Error('NO_SHEET_ID');
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/dashboard_data!A:C?key=${API_KEY}`;
    const res  = await fetch(url);
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err?.error?.message || `HTTP ${res.status}`);
    }
    const data = await res.json();
    const rows = (data.values || []).slice(1); // skip header
    const metrics = {};
    rows.forEach(row => {
      if (row[2]) metrics[row[2].trim()] = row[1] ?? '';
    });
    return metrics;
  }

  // ── CARD BUILDER ────────────────────────────────────────────────────────────
  function card({ label, value, sub = '', size = '', extra = '', hero = false }) {
    return `
      <div class="card${hero ? ' hero' : ''}">
        <div class="card-label">${label}</div>
        <div class="card-value ${size} ${extra}">${value}</div>
        ${sub ? `<div class="card-sub">${sub}</div>` : ''}
      </div>`;
  }

  function liftClass(raw) {
    const n = parseFloat(raw);
    return n >= 0 ? 'lift-pos' : 'lift-neg';
  }

  // ── RENDER ──────────────────────────────────────────────────────────────────
  function render(m) {
    const now = new Date();
    const hhmm = now.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('updatedAt').textContent = `Actualizado a las ${hhmm}`;

    const html = `
    <div class="body">

      <div class="section-label">KPIs principales</div>
      <div class="grid-3">
        ${card({ label: '💰 Revenue recuperado',   value: fmt.currency(m.total_revenue),         sub: 'Ingresos atribuidos a email', hero: true, extra: 'accent' })}
        ${card({ label: '🛍 Pedidos atribuidos',    value: fmt.number(m.attributed_orders),       sub: 'Conversiones directas' })}
        ${card({ label: '📈 Factor ROI',            value: fmt.roi(m.roi_factor),                 sub: 'Retorno sobre inversión', extra: 'green' })}
      </div>

      <div class="section-label">Métricas de valor</div>
      <div class="grid-3">
        ${card({ label: 'AOV FIDELU',      value: fmt.currency(m.aov_recuperado),  sub: 'Ticket promedio recuperado', size: 'sm' })}
        ${card({ label: 'AOV Tienda',      value: fmt.currency(m.store_avg_aov),   sub: 'Ticket promedio general',    size: 'sm', extra: 'muted' })}
        ${card({ label: 'Lift AOV',        value: fmt.percent(m.aov_lift_percent), sub: 'Mejora sobre baseline',      size: 'sm', extra: liftClass(m.aov_lift_percent) })}
      </div>

      <div class="section-label">Eficiencia de conversión</div>
      <div class="grid-3">
        ${card({ label: 'Total clicks',         value: fmt.number(m.total_clicks),              size: 'sm' })}
        ${card({ label: 'Click → conversión',   value: fmt.percentNoSign(m.click_to_conversion), size: 'sm' })}
        ${card({ label: 'Earning / click',      value: fmt.currency(m.earning_per_click),       size: 'sm' })}
      </div>

      <div class="section-label">Salud del sistema</div>
      <div class="grid-4">
        ${card({ label: 'Emails enviados',        value: fmt.number(m.total_emails),           size: 'xs' })}
        ${card({ label: 'Clientes contactados',   value: fmt.number(m.clientes_contactados),   size: 'xs' })}
        ${card({ label: 'Unsubs gestionados',     value: fmt.number(m.unsubscribes_managed),   size: 'xs', extra: 'muted' })}
        ${card({ label: 'Bounces gestionados',    value: fmt.number(m.bounces_managed),        size: 'xs', extra: 'muted' })}
      </div>

    </div>`;

    document.getElementById('appContent').innerHTML = html;
  }

  function renderError(code) {
    const msgs = {
      NO_SHEET_ID: ['Falta el ID de la hoja', 'Agregá el parámetro <code>?sheet=ID_DE_TU_HOJA</code> en la URL.'],
      default:     ['No se pudieron cargar los datos', 'Verificá que la hoja esté compartida como "Cualquier persona con el enlace puede ver" y que el ID sea correcto.']
    };
    const [title, msg] = msgs[code] || msgs.default;
    document.getElementById('appContent').innerHTML = `
      <div class="error-screen">
        <div class="error-icon">⚠</div>
        <div class="error-title">${title}</div>
        <div class="error-msg">${msg}</div>
      </div>`;
  }

  // ── INIT ────────────────────────────────────────────────────────────────────
  async function loadData() {
    try {
      const metrics = await fetchMetrics();
      render(metrics);
    } catch (e) {
      console.error(e);
      renderError(e.message === 'NO_SHEET_ID' ? 'NO_SHEET_ID' : 'default');
    }
  }

  loadData();
  setInterval(loadData, 5 * 60 * 1000); // auto-refresh cada 5 min
</script>
</body>
</html>
